<script id="workload-chart-controller">
(() => {
  const workload = JSON.parse(document.getElementById("workload-chart-data").textContent);
  const selector = document.getElementById("factor");
  const charts = [["workloadArrival", "requests", "#19745c", 1 / 300, "请求 / 秒"],
                  ["workloadTokens", "tokens", "#5279ba", 1 / 1e6, "百万 token / 5 分钟"]];

  function draw(canvas, points, color, conversion, unit, days) {
    const bounds = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(bounds.width * dpr));
    canvas.height = Math.max(1, Math.round(bounds.height * dpr));
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    const left = 57, right = bounds.width - 16, top = 35, bottom = bounds.height - 48;
    const peak = Math.max(...points.map(point => point[1] * conversion));
    const power = peak > 0 ? 10 ** Math.floor(Math.log10(peak / 4)) : 1;
    const step = [1, 2, 2.5, 5, 10].map(value => value * power).find(value => value * 4 >= peak);
    ctx.font = '11px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = "#61736c";
    ctx.textAlign = "left";
    ctx.fillText(unit, left, 16);
    for (let index = 0; index <= 4; index++) {
      const y = bottom - index * (bottom - top) / 4;
      ctx.strokeStyle = "#dfe5de";
      ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
      ctx.textAlign = "right";
      ctx.fillText(Number((index * step).toPrecision(4)).toLocaleString("zh-CN"), left - 9, y + 4);
      const x = left + index * (right - left) / 4;
      ctx.textAlign = "center";
      ctx.fillText((days * index / 4).toFixed(1), x, bottom + 19);
    }
    ctx.fillText("距所选数据集起点（天）", (left + right) / 2, bounds.height - 7);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    points.forEach(([time, value], index) => {
      const x = left + time / days * (right - left);
      const y = bottom - value * conversion / (4 * step) * (bottom - top);
      if (index === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    canvas.dataset.workloadFactor = selector.value;
    canvas.dataset.axisMax = String(4 * step);
  }

  function update() {
    const data = workload[selector.value];
    if (!data) {
      document.getElementById("workloadSection").hidden = true;
      return;
    }
    document.getElementById("workloadSection").hidden = false;
    const prefix = "标称 " + data.factor + "× · ";
    document.getElementById("workloadArrivalNote").textContent =
      prefix + data.count.toLocaleString("zh-CN") + " 条请求，跨度 " + data.days.toFixed(2) + " 天";
    document.getElementById("workloadTokenNote").textContent =
      prefix + "每 5 分钟加总到达请求的输入 token";
    document.getElementById("workloadWindowNote").textContent =
      "按实际叠加 trace 时间戳统计，保留空窗与越界尾部。每 5 分钟计数；绘图每连续 " +
      data.stride + " 个窗口取峰值所在时间点，末尾补绘最后窗口。输入 token 直接加总，历史上下文随请求重复计入。";
    for (const [id, key, color, conversion, unit] of charts) {
      draw(document.getElementById(id), data[key], color, conversion, unit, data.days);
    }
  }
  selector.addEventListener("change", update);
  for (const id of ["ep8DramTab", "ep8CompareTab"]) {
    document.getElementById(id)?.addEventListener("click", update);
  }
  window.addEventListener("resize", update);
  update();
})();
</script>
