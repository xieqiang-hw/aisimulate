# 共享盘框小样本。两个 DPU 均衡分流，整框读写分别共享 80 GB/s，固定时延为首版假设。
traffic:
  source:
    type: trace
    format: mooncake
    paths:
    - __SET_BY_RUNNER__
    block_size: 16
  load:
    type: trace_timestamps
    speedup: 1.0
engine:
  mode: disaggregated
  model: zai-org/GLM-5.2-FP8
  hardware: h200_sxm
  backend: vllm
  backend_version: 0.24.0
  context_length: 131072
  estimation_mode: op_level
  fallback_policy: deny
  database_mode: SILICON
  enable_chunked_prefill: true
  kv_transfer:
    enclosure:
      num_blocks: 5436678
      read_bandwidth_gbps: 80.0
      write_bandwidth_gbps: 80.0
      latency_to_first_byte_ms: 0.1
  workers:
    prefill:
      parallelism:
        replicas: 1
        tensor: 8
        pipeline: 1
        attention_data: 1
        moe_tensor: 8
        moe_expert: 1
      scheduler:
        max_batched_tokens: 8192
        max_sequences: 4
      kv_cache:
        block_size: 64
        prefix_caching: true
        bytes_per_token: auto
        capacity:
          type: fixed
          blocks: 2048
        host_offload:
          scope: dp_rank_local
          connector: offloading_v0_24
          num_host_blocks: 4152
          d2h_bandwidth_gbps: 32.0
          h2d_bandwidth_gbps: 25.0
          latency_to_first_byte_ms: 0.0
      timing:
        type: default
      startup_seconds: 0.0
    decode:
      parallelism:
        replicas: 1
        tensor: 8
        pipeline: 1
        attention_data: 1
        moe_tensor: 8
        moe_expert: 1
      scheduler:
        max_batched_tokens: 8192
        max_sequences: 256
      kv_cache:
        block_size: 64
        prefix_caching: true
        bytes_per_token: auto
        capacity:
          type: default
          memory_fraction: 0.9
      timing:
        type: default
      startup_seconds: 0.0
evaluation:
  sla:
    ttft_ms: 1000.0
    itl_ms: 30.0
execution:
  resources:
    initialization_timeout_seconds: 3600.0
