# 实验配置；基于 HWACSLab/aisimulate 4f1b31c941c4a434f66b9f23359e9259b963ec21
# experiments/pd_unified/configs/dsv32_i4_g8_p1d3.yaml 修改，Apache-2.0。
# G2 容量和带宽按 TP 分片口径；P→D 交接仍独立，G3 关闭。
traffic:
  source:
    type: trace
    format: mooncake
    paths:
    - __SET_BY_RUNNER__
    block_size: 16
  load:
    type: trace_timestamps
    speedup: 1.0
engine:
  mode: disaggregated
  model: zai-org/GLM-5.2-FP8
  hardware: h200_sxm
  backend: vllm
  backend_version: 0.24.0
  context_length: 131072
  estimation_mode: op_level
  fallback_policy: deny
  database_mode: SILICON
  enable_chunked_prefill: true
  kv_transfer:
    bytes_per_token: auto
    bandwidth_gb_per_second: 50.0
    timing_mode: destination_missing
  workers:
    prefill:
      parallelism:
        replicas: 1
        tensor: 8
        pipeline: 1
        attention_data: 1
        moe_tensor: 8
        moe_expert: 1
      scheduler:
        max_batched_tokens: 8192
        max_sequences: 4
      kv_cache:
        block_size: 64
        prefix_caching: true
        bytes_per_token: auto
        capacity:
          type: default
          memory_fraction: 0.9
        host_offload:
          scope: cluster_shared
          connector: offloading_v0_24
          num_host_blocks: 8192
          d2h_bandwidth_gbps: 32.0
          h2d_bandwidth_gbps: 32.0
          shared_d2h_bandwidth_gbps: 80.0
          shared_h2d_bandwidth_gbps: 80.0
          latency_to_first_byte_ms: 0.0
      timing:
        type: default
      startup_seconds: 0.0
    decode:
      parallelism:
        replicas: 1
        tensor: 8
        pipeline: 1
        attention_data: 1
        moe_tensor: 8
        moe_expert: 1
      scheduler:
        max_batched_tokens: 8192
        max_sequences: 256
      kv_cache:
        block_size: 64
        prefix_caching: true
        bytes_per_token: auto
        capacity:
          type: default
          memory_fraction: 0.9
      timing:
        type: default
      startup_seconds: 0.0
evaluation:
  sla:
    ttft_ms: 5000.0
    itl_ms: 50.0
execution:
  resources:
    initialization_timeout_seconds: 600.0
